<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Étape 7 - Fonctionnalités supplémentaires</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container step-seven">
      <h1>Étape 7 — Trois fonctionnalités supplémentaires</h1>
      <p class="feature-list">Recherche par nom · Modification · Tri par points</p>
      <form id="person-form">
        <label for="nom">Nom:</label>
        <input id="nom" name="nom" type="text" required />
        <label for="prenom">Prénom:</label>
        <input id="prenom" name="prenom" type="text" required />
        <label for="points">Points:</label>
        <input id="points" name="points" type="number" min="0" step="any" required />
        <button id="submit-btn" class="add-btn" type="submit">Ajouter</button>
        <button id="cancel-edit-btn" class="cancel-btn" type="button" hidden>Annuler</button>
      </form>
      <div class="search-bar">
        <label for="search">Rechercher une personne:</label>
        <input id="search" type="search" placeholder="Nom ou prénom" />
        <button id="sort-btn" class="sort-btn" type="button">Trier par points ↑</button>
      </div>
      <p id="message" aria-live="polite"></p>
      <table>
        <thead>
          <tr>
            <th scope="col">N°</th><th scope="col">Nom</th><th scope="col">Prénom</th>
            <th scope="col">Points</th><th scope="col">Select</th>
          </tr>
        </thead>
        <tbody id="person-table-body"></tbody>
        <tfoot>
          <tr class="summary-row">
            <td colspan="5">
              <div class="summary-content">
                <span id="line-count">0 ligne(s)</span>
                <span id="total-points">Total point(s)= 0</span>
              </div>
            </td>
          </tr>
        </tfoot>
      </table>
      <div class="actions">
        <button id="console-btn" class="console-btn" type="button">Console Tableau</button>
        <button id="edit-selected-btn" class="edit-btn" type="button">Modifier la sélection</button>
        <button id="delete-selected-btn" class="delete-btn" type="button">Supprimer</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
